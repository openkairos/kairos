kairos.security.jwt.issuer=https://kairos.test
kairos.security.jwt.access-token-ttl=PT15M
kairos.security.jwt.refresh-token-ttl=P30D
kairos.security.jwt.signing-secret=test-only-secret-that-is-long-enough-for-hs256
kairos.superuser.password=test-only-password
spring.data.mongodb.auto-index-creation=true
spring.mongodb.uri=${KAIROS_TEST_MONGODB_URI:mongodb://localhost:27017/kairos_test}
spring.main.banner-mode=off
logging.level.root=WARN
