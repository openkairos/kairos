spring.application.name=Kairos
spring.mongodb.uri=${KAIROS_MONGODB_URI:mongodb://localhost:27017/kairos}
spring.data.mongodb.auto-index-creation=true
spring.mvc.contentnegotiation.default-content-types=application/json
kairos.security.jwt.issuer=${KAIROS_JWT_ISSUER:http://localhost:8080}
kairos.security.jwt.access-token-ttl=${KAIROS_JWT_ACCESS_TOKEN_TTL:PT15M}
kairos.security.jwt.refresh-token-ttl=${KAIROS_JWT_REFRESH_TOKEN_TTL:P30D}
kairos.security.jwt.signing-secret=${KAIROS_JWT_SIGNING_SECRET:development-only-secret-not-for-production}
