services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '${MONGODB_HOST_PORT:-27017}:27017'
    volumes:
      - kairos_mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 })']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - kairos_network

volumes:
  kairos_mongodb_data:

networks:
  kairos_network:
