version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-type: direct
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: quarterly
