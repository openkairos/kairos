name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:9.0.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - parallel:
          - name: Check code formatting
            run: ./mvnw -Dproject.build.directory="$RUNNER_TEMP/format" spotless:check

          - name: Run tests
            run: ./mvnw -Dproject.build.directory="$RUNNER_TEMP/test" test

          - name: Run static analysis
            run: ./mvnw -Dproject.build.directory="$RUNNER_TEMP/static-analysis" spotbugs:check

          - name: Build Docker image
            run: make image IMAGE=kairos IMAGE_TAG=ci REVISION=${{ github.sha }} BUILD_DIRECTORY="$RUNNER_TEMP/container-image"
