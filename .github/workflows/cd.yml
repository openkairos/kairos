name: CD

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Publish Kairos artifacts
    runs-on: ubuntu-latest

    concurrency:
      group: ghcr-${{ github.repository }}
      cancel-in-progress: false

    permissions:
      actions: read
      contents: write
      packages: write

    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve publication metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = release ]; then
            if ! [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "Release tags must be semantic versions without a prefix." >&2
              exit 1
            fi

            version="$RELEASE_TAG"
            image_tags="$(printf '%s\\n%s' "$REGISTRY/$IMAGE_NAME:$version" "$REGISTRY/$IMAGE_NAME:latest")"
          else
            version="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
            image_tags="$REGISTRY/$IMAGE_NAME:test"
          fi

          {
            echo "version=$version"
            echo "image_tags<<EOF"
            echo "$image_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Require successful CI for this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=completed&per_page=100" --jq 'any(.workflow_runs[]; .conclusion == "success")')"

          if [ "$successful_runs" != true ]; then
            echo "CI has not succeeded for $GITHUB_SHA." >&2
            exit 1
          fi

      - name: Build the image context
        run: make image-context VERSION=${{ steps.metadata.outputs.version }}

      - name: Upload the release JAR
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.metadata.outputs.version }}" "target/kairos-${{ steps.metadata.outputs.version }}.jar" --clobber

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: build/image
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.image_tags }}
          build-args: |
            APPLICATION_VERSION=${{ steps.metadata.outputs.version }}
            VCS_REF=${{ github.sha }}
