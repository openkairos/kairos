name: Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:9.0.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - parallel:
          - name: Check code formatting
            run: ./mvnw spotless:check

          - name: Run tests
            run: ./mvnw test

          - name: Run static analysis
            run: ./mvnw spotbugs:check

      - name: Build Docker image
        run: make image IMAGE=kairos IMAGE_TAG=ci REVISION=${{ github.sha }}

  publish:
    name: Publish Kairos artifacts
    needs: check
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    concurrency:
      group: ghcr-${{ github.repository }}
      cancel-in-progress: false

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout the selected revision
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve publication metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            if ! [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "Release tags must be semantic versions without a prefix." >&2
              exit 1
            fi

            version="$RELEASE_TAG"
            image_tags="$(printf '%s\n%s' "$REGISTRY/$IMAGE_NAME:$version" "$REGISTRY/$IMAGE_NAME:latest")"
          else
            version="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
            image_tags="$REGISTRY/$IMAGE_NAME:test"
          fi

          {
            echo "version=$version"
            echo "image_tags<<EOF"
            echo "$image_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build the image context
        run: make image-context VERSION=${{ steps.metadata.outputs.version }}

      - name: Upload the release JAR
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.metadata.outputs.version }}" "target/kairos-${{ steps.metadata.outputs.version }}.jar" --clobber

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: build/image
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.image_tags }}
          build-args: |
            APPLICATION_VERSION=${{ steps.metadata.outputs.version }}
            VCS_REF=${{ github.sha }}
